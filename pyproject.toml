[tool.poetry]
name = "llm-discharge-summaries"
version = "1.0.0"
description = ""
authors = ["simonEllershaw <simje@live.co.uk>"]
readme = "README.md"
packages = [{include = "llm_discharge_summaries"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.16"
jupyter = "^1.0.0"
python-dotenv = "^1.0.0"
openai = "^0.27.8"
matplotlib = "^3.7.2"
jsonschema = "^4.19.0"
jsonref = "^1.1.0"
pandas = "^2.1.4"
openpyxl = "^3.1.2"
# pydantic fixed so schema generation is consistent 
# (note this has had to change for medcat)
pydantic = "^2.14.1"
python-docx = "^1.1.0"
transformers = "^4.38.2"
torch = "^2.2.1"
medcat = {extras = ["spacy"], version = "^2.9.0"}
scipy = "^1.13.0"
jupyterlab = "^4.1.8"
tiktoken = "^0.14.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.autoflake]
remove_all_unused_imports = true

[tool.black]
preview = true

[tool.isort]
profile = "black"
filter_files = true

[tool.mypy]
ignore_missing_imports = true
